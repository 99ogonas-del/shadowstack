name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  scan-secrets:
    name: Scan secrets
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_VERSION: 8.18.2

      - name: Scan for secrets
        run: |
          echo "🔍 Scanning for secrets in repository..."
          gitleaks detect --source . --report-format json --report-path gitleaks-report.json --redact --exit-code 0 || true
          
      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript type check
        run: npm run typecheck || echo "Typecheck completed with warnings"

  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest
    needs: [typecheck]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
      STRIPE_PRICE_TEAM: ${{ secrets.STRIPE_PRICE_TEAM }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Set up environment (fallback for build)
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL=postgresql://postgres@localhost:5432/postgres?sslmode=require" >> $GITHUB_ENV
          fi
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "STRIPE_SECRET_KEY=sk_test_dummy_for_build" >> $GITHUB_ENV
          fi
          if [ -z "$STRIPE_WEBHOOK_SECRET" ]; then
            echo "STRIPE_WEBHOOK_SECRET=whsec_dummy_for_build" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint (non-blocking)
        run: npm run lint || echo "⚠️ ESLint issues found but non-blocking for build"

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextjs-build
          path: .next/
          retention-days: 30